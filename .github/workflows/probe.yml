name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: doh + curl probe
        run: |
          set +e
          IP=$(python3 - <<'PY'
import json, urllib.request
try:
    req = urllib.request.Request('https://cloudflare-dns.com/dns-query?name=neuqprobemtr0oeou.workers.dev&type=A', headers={'accept':'application/dns-json'})
    j = json.load(urllib.request.urlopen(req, timeout=15))
    ans = [a['data'] for a in j.get('Answer', []) if a.get('type') == 1]
    print(ans[0] if ans else '')
except Exception as e:
    print('')
PY
)
          echo "DOH_IP=[$IP]"
          if [ -n "$IP" ]; then
            curl -sS -m 45 --resolve neuqprobemtr0oeou.workers.dev:443:$IP https://neuqprobemtr0oeou.workers.dev/probe-neuq
          else
            echo "NXDOMAIN_OR_DOH_FAIL"
            curl -sS -m 20 'https://cloudflare-dns.com/dns-query?name=neuqprobemtr0oeou.workers.dev&type=A' -H 'accept: application/dns-json' || echo DOH_UNREACHABLE
          fi
