name: NEUQ Classroom Query (WebVPN CAS/SSO)

on:
  push:
    branches: [ main, master ]
  schedule:
    # GitHub Actions cron 为 UTC。每小时 20 分触发，避开 Cloudflare 侧的 30 分
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: 'Force overwrite existing data'
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build & deploy (fetch via WebVPN CAS/SSO)
      env:
        # 教务账号（学号 + 密码），门户缺省复用同一组凭据
        YOUR_NEUQ_USERNAME: ${{ secrets.YOUR_NEUQ_USERNAME }}
        YOUR_NEUQ_PASSWORD: ${{ secrets.YOUR_NEUQ_PASSWORD }}
        # 通过校外 WebVPN 重写地址抓取（门户 CAS 统一认证，eams 由 SSO 放行）
        NEUQ_JWXT_BASE_URL: "https://vpn.neuq.edu.cn/http/77726476706e69737468656265737421fae05988693e6d456f468ca88d1b203b/eams/"
        NEUQ_VPN_ENABLED: "true"
        NEUQ_VPN_BASE_URL: "https://vpn.neuq.edu.cn"
        NEUQ_VPN_AUTH_METHOD: "cas"
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
        TOTAL_DAYS: "7"
        FORCE_OVERWRITE: ${{ inputs.force_overwrite || 'false' }}
      run: bash build.sh

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
