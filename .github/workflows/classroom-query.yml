name: Rust Classroom Query and Deploy Automation

on:
  push:
    branches: [ main, master ]
  # 定时构建已改由 Cloudflare Pages 承担（见 DEPLOY.md）。
  # 教务系统目前对外返回 483，定时跑只会持续失败；恢复后取消下面三行注释即可重新启用。
  # schedule:
  #   - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: 'Force overwrite existing data'
        required: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        
    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install mold linker
      run: sudo apt-get install -y mold

    - name: Build Rust project
      env:
        RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=mold"
      run: cargo build --profile ci

    - name: Run tests
      run: cargo test

    - name: Fetch Classroom Data
      env:
        YOUR_NEUQ_USERNAME: ${{ secrets.YOUR_NEUQ_USERNAME }}
        YOUR_NEUQ_PASSWORD: ${{ secrets.YOUR_NEUQ_PASSWORD }}
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
        FORCE_OVERWRITE: ${{ inputs.force_overwrite || 'false' }}
      run: ./target/ci/neuq-classroom-query fetch

    - name: Process Data
      env:
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
      run: ./target/ci/neuq-classroom-query process

    - name: Generate HTML
      env:
        ASSETS_DIR: ./assets
        OUTPUT_DIR: ./output
      run: ./target/ci/neuq-classroom-query generate

    - name: Assemble Pages output
      run: |
        mkdir -p public
        cp index.html public/
        cp -r assets public/
        if [ -d output ]; then cp -r output public/; fi
        touch public/.nojekyll
        du -sh public

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
