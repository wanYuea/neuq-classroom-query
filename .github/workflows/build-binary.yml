name: Build Linux Binary

# 用途：在云端编译 Linux x86_64 二进制并发布到 Release，
#       供 2GiB 小内存服务器免编译部署（服务器上直接下载运行即可）。
# 兼容性：在 AlmaLinux 8（glibc 2.28 / openssl 1.1.1）容器内编译，
#       可运行于 Alibaba Cloud Linux 2/3、RHEL 8/9、CentOS 8+ 等 glibc>=2.28 的系统。
#       基线越低兼容性越好（低版本系统编译的二进制能在高版本系统上运行）。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-binary.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside AlmaLinux 8 container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD":/src -w /src almalinux:8 bash -lc '
            set -e
            # 注意：AlmaLinux 8 预装 curl-minimal（已提供 curl 命令），
            # 再装 curl 包会冲突报错，故此处不装 curl
            dnf install -y -q gcc gcc-c++ make openssl-devel pkgconfig perl tar gzip git
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --profile ci
            cp target/ci/neuq-classroom-query /src/neuq-classroom-query-linux-x86_64
            # 容器内是 root，必须在容器里 chmod，否则宿主机 runner 无权改权限
            chmod 755 /src/neuq-classroom-query-linux-x86_64
            # 同时产出 gzip 压缩包（约 1/3 体积），供境内服务器快速下载
            dnf install -y -q gzip >/dev/null 2>&1 || true
            gzip -9 -c /src/neuq-classroom-query-linux-x86_64 > /src/neuq-classroom-query-linux-x86_64.gz
            chmod 644 /src/neuq-classroom-query-linux-x86_64.gz
          '

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh neuq-classroom-query-linux-x86_64
          file neuq-classroom-query-linux-x86_64 || true
          gh release create prebuilt-linux-x64 \
            --title "Linux x86_64 预编译二进制" \
            --notes "GitHub Actions 自动构建（AlmaLinux 8 / glibc 2.28 / openssl 1.1.1）。用于境内小内存服务器免编译部署：下载后 chmod +x 即可运行。" \
            --target "${GITHUB_SHA}" 2>/dev/null || true
          gh release upload prebuilt-linux-x64 neuq-classroom-query-linux-x86_64 --clobber
          gh release upload prebuilt-linux-x64 neuq-classroom-query-linux-x86_64.gz --clobber
          echo "原始：https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt-linux-x64/neuq-classroom-query-linux-x86_64"
          echo "压缩包(推荐境内下载，约1/3体积)：https://github.com/${GITHUB_REPOSITORY}/releases/download/prebuilt-linux-x64/neuq-classroom-query-linux-x86_64.gz"
