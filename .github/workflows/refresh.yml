---
name: Refresh & Publish

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-publish
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    container: almalinux:8
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt binary
        run: |
          curl -sSL --retry 3 -o ncq.gz \
            "https://github.com/${{ github.repository }}/releases/download/prebuilt-linux-x64/neuq-classroom-query-linux-x86_64-al8.gz"
          gunzip -c ncq.gz > ncq && chmod +x ncq
          ldd ./ncq | grep -i "not found" && { echo "缺依赖"; exit 1; } || echo "deps OK"

      - name: Fetch via WebVPN CAS + generate
        id: fetch
        env:
          YOUR_NEUQ_USERNAME: ${{ secrets.NEUQ_USERNAME }}
          YOUR_NEUQ_PASSWORD: ${{ secrets.NEUQ_PASSWORD }}
          NEUQ_JWXT_BASE_URL: 'https://vpn.neuq.edu.cn/http/77726476706e69737468656265737421fae05988693e6d456f468ca88d1b203b/eams/'
          NEUQ_VPN_ENABLED: 'true'
          NEUQ_VPN_BASE_URL: 'https://vpn.neuq.edu.cn'
          NEUQ_VPN_AUTH_METHOD: 'cas'
          TOTAL_DAYS: '7'
          REQUEST_DELAY_MS: '2000'
          MAX_RETRIES: '4'
          ASSETS_DIR: './assets'
          OUTPUT_DIR: './output'
        shell: bash {0}
        run: |
          for i in 1 2 3; do
            echo "=== 抓取尝试 $i/3 ==="
            if ./ncq deploy; then
              echo "✔ 抓取成功（第 $i 次尝试）"
              exit 0
            fi
            if [ "$i" = "3" ]; then
              echo "✖ 三次尝试均失败"; exit 1
            fi
            echo "失败，${i} 分钟后重试..."
            sleep $((i * 60))
          done

      - name: Assemble public/
        run: |
          rm -rf public && mkdir -p public
          cp index.html public/
          cp -r assets public/
          cp -r output public/
          touch public/.nojekyll
          du -sh public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=neuq-classroom-query --branch=main
